[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deltasync"
version = "1.0.0"
description = "rsync style rolling checksum delta encoding and FastCDC content defined chunking, from scratch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohammad Hossinzehi" }]

[project.scripts]
deltasync = "deltasync.__main__:main"

[tool.setuptools]
packages = ["deltasync"]
